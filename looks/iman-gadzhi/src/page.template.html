<!doctype html>

<style>
  @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: %%GROUND%%; }
  body { font-family: "Inter", sans-serif; }

  #plate { position: absolute; inset: 0; z-index: 0; background: %%GROUND%%; }
  /* the camera: punch-ins scale from y~1000 (the nose) so the chin stays above the captions and the hair below the top band */
  #cam { position: absolute; inset: 0; z-index: 1; overflow: hidden; transform-origin: 50% 52%; }
  #cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* handwritten notes (baked Caveat glyphs, pen-traced write-on) */
  .note-w { position: absolute; z-index: 9; }
  .note-w.center { left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .note-svg { overflow: visible; display: block; }
  .squig { overflow: visible; display: block; margin-top: -6px; }
  .squig path { fill: none; stroke: %%INK%%; stroke-width: 8; stroke-linecap: round; }

  /* tape labels: torn-edge strip, condensed caps */
  .tape-w { position: absolute; z-index: 8; display: flex; align-items: center; justify-content: center; }
  .tape-bg { position: absolute; inset: 0; z-index: 0; background: %%INK%%; }
  .tape-accent .tape-bg { background: %%ACCENT%%; }
  .tape-text { position: relative; z-index: 1; font-family: "Anton"; color: #FFFFFF; line-height: 1; letter-spacing: 0.01em;
               white-space: nowrap; padding-top: 0.03em; }
  .tape-text span, .mj-small span, .mj-hero span { display: inline-block; }
  .stamp { position: absolute; z-index: 10; font: 64px/1 "Anton"; color: #FFFFFF; background: %%ACCENT%%;
           padding: 10px 18px 6px; letter-spacing: 0.02em; }

  /* progress rail: the numbered chapter device */
  #rail { position: absolute; z-index: 7; display: flex; gap: 14px; }
  .rbox { width: 66px; height: 66px; border: 4px solid %%INK%%; background: rgba(11, 11, 13, 0.82);
          display: flex; align-items: center; justify-content: center; }
  .rbox span { font: 44px/1 "Anton"; color: #FFFFFF; opacity: 0.5; padding-top: 2px; }

  /* full-screen majors: one accent field (concept) or black field (number), always textured, never flat */
  .major { position: absolute; inset: 0; z-index: 15; overflow: hidden; }
  .field-accent { background: %%ACCENT%%; }
  .field-black { background: %%INK%%; }
  .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); background-size: 1080px 1920px;
           mix-blend-mode: overlay; opacity: 0.38; }
  .doodles { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #FFFFFF; stroke-width: 5;
             stroke-linecap: round; stroke-linejoin: round; }
  .mj-small, .mj-hero, .mj-num { position: absolute; left: 0; right: 0; text-align: center; font-family: "Anton";
                                 color: #FFFFFF; line-height: 1; letter-spacing: 0.01em; white-space: nowrap; }
  .mj-small { top: 350px; }
  .mj-hero { top: 470px; line-height: 0.92; }
  .mj-num { top: 560px; }
  .mj-num .acc { color: %%ACCENT%%; }
  .cash { position: absolute; left: 180px; top: 900px; width: 720px; height: 400px; overflow: visible; }
  .bill-paper { fill: #FFFFFF; stroke: %%INK%%; stroke-width: 6; }
  .bill-line { fill: none; stroke: %%INK%%; stroke-width: 4; }
  .bill-sign { font: 96px "Anton"; fill: %%ACCENT%%; text-anchor: middle; }

  /* captions: the speaker's words, 3 at most, the spoken word sits on the accent block */
  .capgroup { position: absolute; left: 0; right: 0; top: 1440px; z-index: 30; text-align: center; padding: 0 60px;
              font: 800 62px/1.25 "Inter"; letter-spacing: -0.01em; color: #FFFFFF; overflow: visible; }
  .cw { display: inline-block; padding: 0 12px 4px; border-radius: 10px; background-color: rgba(34, 48, 232, 0);
        -webkit-text-stroke: 7px %%INK%%; paint-order: stroke fill; }

<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1080" data-height="1920">
    <div id="plate" class="clip" data-start="0" data-duration="%%DUR%%" data-track-index="0"></div>
    <div id="cam">
      %%FOOTAGE%%
    </div>
%%HOOK%%
%%RAIL%%
%%CHAPTERS%%
%%MAJORS%%
    <div id="captions" data-track-kind="captions">
      %%CAPTIONS%%
    </div>

    %%SFX%%
  </div>

  <script>
  (function () {
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ---------- one onUpdate dispatcher (hw family rule: one timeline, one onUpdate) ---------- */
    const RENDERS = [];
    function onRender(fn) { RENDERS.push(fn); }
    tl.eventCallback("onUpdate", () => { for (const f of RENDERS) f(); });

    /* ---------- stop-motion ease: quantise any ease to n steps (the rough paper feel) ---------- */
    function stepEase(name, n) {
      const e = gsap.parseEase(name);
      return (p) => (p >= 1 ? 1 : e(Math.round(p * n) / n));
    }

    /* ---------- seeded hash (deterministic boil and squiggles) ---------- */
    function hash(n, seed) { const x = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; }

    /* ---------- pen-velocity ease, from the registry block hw-write-title (curvature-adaptive) ---------- */
    function penEase(path) {
      const L = path.getTotalLength();
      if (L <= 0) return { ease: (t) => t, inkTime: 1 };
      const PRE = 48, pts = [];
      for (let i = 0; i <= PRE; i++) pts.push(path.getPointAtLength((L * i) / PRE));
      const curv = [0];
      for (let i = 1; i < PRE; i++) {
        const ax = pts[i].x - pts[i - 1].x, ay = pts[i].y - pts[i - 1].y, bx = pts[i + 1].x - pts[i].x, by = pts[i + 1].y - pts[i].y;
        const la = Math.hypot(ax, ay) || 1e-6, lb = Math.hypot(bx, by) || 1e-6;
        curv.push(Math.acos(Math.max(-1, Math.min(1, (ax * bx + ay * by) / (la * lb)))) / ((la + lb) / 2));
      }
      curv.push(0);
      let mass = 0; for (const c of curv) mass += c;
      const N = Math.max(25, Math.min(75, Math.round(25 + mass * 18))), seg = L / N, times = [0];
      let t = 0;
      for (let i = 1; i <= N; i++) {
        const u = ((i - 0.5) / N) * PRE, i0 = Math.floor(u), f = u - i0;
        const c = curv[Math.min(i0, PRE)] * (1 - f) + curv[Math.min(i0 + 1, PRE)] * f;
        t += seg / Math.max(1 / (1 + 10 * c * 14), 0.22); times.push(t);
      }
      for (let i = 0; i <= N; i++) times[i] /= t;
      return { inkTime: t, ease: (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = N; while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (times[mid] <= p) lo = mid; else hi = mid; }
        return (lo + (p - times[lo]) / (times[hi] - times[lo] || 1e-9)) / N; } };
    }

    /* ---------- build a handwritten note from the baked Caveat table (filled glyphs under centreline masks) ---------- */
    function hwBuild(key, text, px, ink) {
      const svg = document.getElementById(key + "-note"), T = window.__hwPenCaveat, ns = "http://www.w3.org/2000/svg";
      const g = document.createElementNS(ns, "g"); let x = 0; const strokes = []; let gi = 0;
      for (const ch of text) {
        if (ch === " ") { x += 300; continue; }
        const gl = T.glyphs[ch]; if (!gl) { console.warn("no baked glyph for", ch); x += 400; continue; }
        const gg = document.createElementNS(ns, "g"); gg.setAttribute("transform", `translate(${x},0)`);
        const mask = document.createElementNS(ns, "mask"), id = `${key}-m${gi++}`;
        mask.setAttribute("id", id); mask.setAttribute("maskUnits", "userSpaceOnUse");
        mask.setAttribute("x", "-200"); mask.setAttribute("y", "-900"); mask.setAttribute("width", gl.adv + 400); mask.setAttribute("height", "1400");
        for (const d of gl.strokes) {
          const p = document.createElementNS(ns, "path");
          p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#fff");
          p.setAttribute("stroke-width", Math.max(30, Math.round(gl.stem * 1.35)));
          p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
          mask.appendChild(p); strokes.push(p);
        }
        const o = document.createElementNS(ns, "path"); o.setAttribute("d", gl.outline); o.setAttribute("fill", ink); o.setAttribute("mask", `url(#${id})`);
        gg.appendChild(mask); gg.appendChild(o); g.appendChild(gg); x += gl.adv;
      }
      svg.appendChild(g);
      const s = px / 1000, h = T.meta.ascent - T.meta.descent;
      svg.setAttribute("width", Math.ceil(x * s)); svg.setAttribute("height", Math.ceil(h * s));
      svg.setAttribute("viewBox", `0 ${-T.meta.ascent} ${x} ${h}`);
      const metas = strokes.map((p) => {
        const len = p.getTotalLength(); p.setAttribute("stroke-dasharray", `${len} ${len}`);
        return { p, len, pe: penEase(p), st: { v: 0 } };
      });
      onRender(() => { for (const m of metas) { m.p.style.strokeDashoffset = m.len * (1 - m.st.v); m.p.style.opacity = m.st.v > 0 ? "1" : "0"; } });
      return { metas, wPx: Math.ceil(x * s), svg };
    }
    /* write it on in `dur` seconds: strokes in pen order, time shared by ink length, tiny pen lifts */
    function hwWrite(tl, b, at, dur) {
      const lift = Math.min(0.025, (dur * 0.3) / Math.max(1, b.metas.length));
      const inkSum = b.metas.reduce((a, m) => a + m.pe.inkTime, 0);
      const draw = Math.max(0.1, dur - lift * (b.metas.length - 1));
      let t = at;
      for (const m of b.metas) { const d = (m.pe.inkTime / inkSum) * draw; tl.to(m.st, { v: 1, duration: d, ease: m.pe.ease }, t); t += d + lift; }
    }
    function hwOn(tl, b) { for (const m of b.metas) m.st.v = 1; }          /* already written (frame-0 hook) */

    /* hand-drawn squiggle underline that draws on */
    function squiggle(tl, id, w, at) {
      const path = document.getElementById(id), svg = path.ownerSVGElement;
      svg.setAttribute("width", w); svg.setAttribute("viewBox", `0 0 ${w} 40`);
      const segs = Math.max(6, Math.round(w / 90)); let d = `M 4 ${(18 + hash(0, 5) * 4).toFixed(1)}`;
      for (let i = 1; i <= segs; i++) {
        const x2 = (w / segs) * i - (i === segs ? 4 : 0), y2 = 18 + hash(i * 5 + 1, 5) * 6;
        const cx = x2 - w / segs / 2 + hash(i * 5 + 2, 5) * 10, cy = 18 + (i % 2 ? -1 : 1) * (9 + hash(i * 5 + 3, 5) * 4);
        d += ` Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
      }
      path.setAttribute("d", d);
      const len = path.getTotalLength();
      tl.fromTo(path, { strokeDasharray: `${len} ${len}`, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.26, ease: "power2.inOut" }, at);
    }

    /* number roll: integers only, lands exactly on the spoken number */
    function counter(tl, sel, from, to, t0, t1) {
      const el = document.querySelector(sel), o = { v: from };
      tl.fromTo(o, { v: from }, { v: to, duration: Math.max(0.1, t1 - t0), ease: "power1.in",
        onUpdate: () => { el.textContent = String(Math.min(to, Math.max(from, Math.floor(o.v + 1e-6)))); } }, t0);
    }

    /* boil: every 3 frames the handwriting re-poses by ~1.4 px (hand-drawn, not a floating loop) */
    const BOIL = gsap.utils.toArray(".note-svg");
    onRender(() => {
      const step = Math.floor((tl.time() * 30) / 3);
      BOIL.forEach((el, i) => gsap.set(el, { x: hash(step * 3 + i * 97, 8) * 1.4, y: hash(step * 3 + 1 + i * 97, 8) * 1.4,
                                            rotation: hash(step * 3 + 2 + i * 97, 8) * 0.5 }));
    });

    const NOTES = {
      %%NOTES%%
    };

    %%TIMELINE%%

    // ---- captions (generated from the word file) ----
    %%CAPJS%%

    window.__timelines["main"] = tl;
  })();
  </script>
